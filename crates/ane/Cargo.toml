[package]
name = "ane"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust bindings for the Apple Neural Engine (ANE) via the private AppleNeuralEngine.framework"
repository = "https://github.com/computer-graphics-tools/ane"
readme = "../../README.md"
keywords = ["apple", "neural-engine", "ane", "machine-learning"]
categories = ["api-bindings", "hardware-support"]

[dependencies]
thiserror.workspace = true
objc2 = { workspace = true, features = ["exception"] }
obfstr.workspace = true
objc2-foundation.workspace = true
objc2-io-surface.workspace = true
libc.workspace = true
block2 = "0.6.2"
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
plist.workspace = true

[dev-dependencies]
rand.workspace = true

[lints.clippy]
module_inception = "allow"
